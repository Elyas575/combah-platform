services:
  - type: web
    name: combah-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: COMBAH_DEMO
        value: "0"
      - key: COMBAH_SECURE_COOKIES
        value: "1"
      - key: COMBAH_DATA_DIR
        value: /tmp/combah_data
