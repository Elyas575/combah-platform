services:
  app:
    build: .
    restart: unless-stopped
    environment:
      COMBAH_DEMO: "0"
      COMBAH_SECURE_COOKIES: "1"
      COMBAH_DATA_DIR: /app/data
    volumes:
      - app_data:/app/data
    expose:
      - "8000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      COMBAH_DOMAIN: ${COMBAH_DOMAIN:?Set your registered domain in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  app_data:
  caddy_data:
  caddy_config:
